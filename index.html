<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffd47b">
<meta name="mcr-build" content="github-v2.6-controls-hazard-boss">
<title>МЦР - Битва за рейтинг</title>
<link rel="stylesheet" href="./styles.css?v=2.6">
<script src="./app.js?v=2.6"></script>
</head>
<body>
<section id="startScreen">
  <div class="brand">
    <h1>МЦР</h1>
    <div class="subtitle">БИТВА ЗА РЕЙТИНГ СУБЪЕКТОВ РФ</div>
  </div>
<div class="grid" id="heroGrid">

      <button class="hero-card selected" data-id="first" onclick="pickHero('first')" type="button">
        <div class="portrait"><img src="./assets/first.webp?v=2.2" alt="Первый зам"></div>
        <h3>Первый зам</h3>
        <span class="power">⚡ Многозадачность</span>
      </button>

      <button class="hero-card" data-id="zam" onclick="pickHero('zam')" type="button">
        <div class="portrait"><img src="./assets/zam.webp?v=2.2" alt="Зам"></div>
        <h3>Зам</h3>
        <span class="power">⚡ Поглощение задач</span>
      </button>

      <button class="hero-card " data-id="bif" onclick="pickHero('bif')" type="button">
        <div class="portrait"><img src="./assets/bif.webp?v=2.2" alt="БИФ"></div>
        <h3>БИФ</h3>
        <span class="power">⚡ Шампур решения</span>
      </button>

      <button class="hero-card " data-id="school21" onclick="pickHero('school21')" type="button">
        <div class="portrait"><img src="./assets/school21.webp?v=2.2" alt="Школа 21"></div>
        <h3>Школа 21</h3>
        <span class="power">⚡ Возражение</span>
      </button>

      <button class="hero-card " data-id="sitcenter" onclick="pickHero('sitcenter')" type="button">
        <div class="portrait"><img src="./assets/sitcenter.webp?v=2.2" alt="Ситцентр"></div>
        <h3>Ситцентр</h3>
        <span class="power">⚡ Замедление</span>
      </button>

      <button class="hero-card " data-id="mfc" onclick="pickHero('mfc')" type="button">
        <div class="portrait"><img src="./assets/mfc.webp?v=2.2" alt="МФЦ"></div>
        <h3>МФЦ</h3>
        <span class="power">⚡ Голосовой робот</span>
      </button>
  </div>
  <div class="startWrap">
    <button id="playBtn" type="button" onclick="startGame()">Начать рабочий день</button>
    <div class="hint">Выберите героя. Суперсила указана на карточке.</div>
  </div>
</section>

<section id="gameScreen" class="hidden">
  <div id="gameArea"
       onpointerdown="gamePointerDown(event)"
       onpointermove="gamePointerMove(event)"
       onpointerup="gamePointerUp()"
       onpointercancel="gamePointerUp()">
    <div class="city"></div>
    <header id="hud">
      <div class="hudBox"><span class="hudLabel">Белгородская обл.</span><span id="rankValue" class="hudValue">89 <b id="rankArrow"></b></span></div>
      <div class="hudBox"><span class="hudLabel">Поймано</span><span id="scoreValue" class="hudValue">0</span></div>
      <div class="hudBox"><span class="hudLabel">Пропущено</span><span id="missValue" class="hudValue">0/9</span></div>
      <div class="hudBox hudActions">
</div>
    </header>

    <div id="boss">
      <img src="./assets/boss.webp?v=2.6" alt="Босс">
      <div class="bossLabel">ШЕФ</div>
    </div>

    <div id="ranking">
      <div class="title">Рейтинг РФ</div>
      <div id="rankingRows"></div>
    </div>

    <div id="player">
      <img id="playerPortrait" src="./assets/first.webp?v=2.5" alt="Игрок">
      <div id="playerName">Первый зам</div>
    </div>

    <div id="toast"></div>
    <div id="powerStatus" class="powerStatus hidden">
      <span id="powerStatusIcon">⚡</span>
      <span id="powerStatusName">Суперсила</span>
      <b id="powerActiveTime"></b>
    </div>

    <button id="pauseBtn" type="button" onclick="togglePause()" aria-label="Пауза">Ⅱ</button>
    <button id="soundBtn" type="button" onclick="toggleSound()" aria-label="Звук">🔊</button>

    <div id="controls">
      <button class="ctrl" type="button"
        onpointerdown="event.preventDefault();setMove(-1)"
        onpointerup="stopMove()" onpointercancel="stopMove()" onpointerleave="stopMove()">◀</button>
      <button class="ctrl" type="button"
        onpointerdown="event.preventDefault();setMove(1)"
        onpointerup="stopMove()" onpointercancel="stopMove()" onpointerleave="stopMove()">▶</button>
      <button id="powerBtn" type="button" onclick="usePower()">
        <span id="powerName">Многозадачность</span>
        <span id="powerCooldown">ГОТОВО</span>
        <span id="powerBar"><i id="powerBarFill"></i></span>
      </button>
    </div>

    <div class="overlay hidden" id="pauseOverlay">
      <div class="panel"><h2>Пауза</h2><p>Задачи временно согласовали перенос срока.</p>
        <button type="button" onclick="togglePause()">Продолжить</button>
        <button type="button" class="secondary" onclick="returnToStart()">В выбор героя</button>
      </div>
    </div>

    <div class="overlay hidden" id="gameOver">
      <div class="panel"><h2 id="overTitle">Рабочий день окончен</h2><p id="overText"></p>
        <div class="bigScore" id="overRank">89 место</div>
        <button type="button" onclick="restartGame()">Ещё один день</button>
        <button type="button" class="secondary" onclick="returnToStart()">Сменить героя</button>
      </div>
    </div>
  </div>
</section>
<div class="buildTag">МЦР v2.6</div>
</body>
</html>
